<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Register</title>
    <style>
        body{font-family:Arial;background:#f2f2f2;}
        .card{width:400px;margin:60px auto;background:#fff;padding:30px;border-radius:10px;}
        input,button{width:100%;padding:10px;margin:10px 0;}
        button{background:#2e6da4;color:white;border:none;font-size:16px;}
        a{text-align:center;display:block;margin-top:15px;}
    </style>
</head>
<body>
<div class="card">
    <h2>Registration</h2>
    <form th:action="@{/register}" method="post" th:object="${user}">
        <label>Username:</label>
        <input type="text" th:field="*{username}" required />
        <label>Password:</label>
        <input type="password" th:field="*{password}" required />
        <label>Email:</label>
        <input type="email" name="email" required />
        <label>Full Name:</label>
        <input type="text" name="fullName" required />
        <button type="submit">Register</button>
    </form>
    <a th:href="@{/login}">Already have an account? Login here</a>
</div>
</body>
</html>
