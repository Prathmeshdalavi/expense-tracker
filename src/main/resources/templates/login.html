<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Login</title>
    <style>
        body{font-family:Arial;background:#f2f2f2;}
        .card{width:400px;margin:80px auto;background:#fff;padding:30px;border-radius:10px;}
        input,button{width:100%;padding:10px;margin:10px 0;}
        button{background:#4CAF50;color:white;border:none;font-size:16px;}
        a{text-align:center;display:block;margin-top:15px;}
    </style>
</head>
<body>
<div class="card">
    <h2>Login Page</h2>
    <form th:action="@{/login}" method="post">
        <label>Username:</label>
        <input type="text" name="username" required />
        <label>Password:</label>
        <input type="password" name="password" required />
        <button type="submit">Login</button>
    </form>
    <a th:href="@{/register}">New user? Register here</a>
</div>
</body>
</html>
